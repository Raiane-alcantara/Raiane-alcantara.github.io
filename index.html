<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raiane Alcântara | Video Editor Portfolio</title>
  <meta name="description" content="Video editing portfolio: reels, documentaries, explainers, motion graphics and AI video.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230c4c80'/%3E%3Cpath d='M25 20v24l20-12z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    /* paleta da Raiane: marinho #081621, azul escuro #0C4C80, azul médio #7DB2D1, branco, cinza claro #F8F8F8 */
    :root {
      --bg: #081621; --bg-2: #0f2536; --deep: #0c4c80; --fg: #ffffff; --soft: #f8f8f8; --muted: #a9c3d6; --accent: #7db2d1; --on-accent: #081621;
      --line: rgba(125, 178, 209, .22); --gutter: clamp(16px, 4vw, 48px);
      --display: "Anton", "Arial Narrow", sans-serif; --body: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: radial-gradient(900px 520px at 88% -8%, rgba(12, 76, 128, .75), transparent 65%), radial-gradient(700px 420px at -10% 30%, rgba(12, 76, 128, .35), transparent 60%), var(--bg); background-repeat: no-repeat; background-color: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    img, video, iframe { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .hero { padding: clamp(48px, 9vw, 110px) var(--gutter) 40px; max-width: 1200px; margin: 0 auto; }
    .hero__tag { display: inline-block; background: var(--deep); color: var(--soft); border: 1px solid var(--accent); font-weight: 700; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; padding: .45em 1.1em; border-radius: 999px; }
    .hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 9vw, 6.5rem); line-height: .95; text-transform: uppercase; margin: 22px 0 18px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); max-width: 680px; font-size: clamp(1rem, 1.6vw, 1.15rem); }
    .stats { display: flex; flex-wrap: wrap; gap: 28px 48px; margin-top: 34px; }
    .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1; color: var(--accent); }
    .stat span { color: var(--muted); font-size: .85rem; }

    .tabs { position: sticky; top: 0; z-index: 5; background: rgba(8, 22, 33, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .tabs__in { max-width: 1200px; margin: 0 auto; padding: 14px var(--gutter); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .tabs__in::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; border: 1.5px solid var(--line); border-radius: 999px; padding: .55em 1.2em; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); transition: .2s; }
    .tab:hover { color: var(--fg); border-color: var(--fg); }
    .tab.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

    .grid { max-width: 1200px; margin: 0 auto; padding: 28px var(--gutter) 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .card { position: relative; border-radius: 14px; overflow: hidden; background: var(--bg-2); aspect-ratio: 9 / 16; text-align: left; outline: 2px solid transparent; transition: transform .25s, outline-color .25s; }
    .card--wide { grid-column: span 2; aspect-ratio: auto; }
    .card--wide .card__img { aspect-ratio: 16 / 9; height: auto; }
    .card:hover { transform: translateY(-3px); outline-color: var(--accent); box-shadow: 0 12px 30px rgba(12, 76, 128, .45); }
    .card__img { width: 100%; height: 100%; object-fit: cover; }
    .card__info { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; background: linear-gradient(transparent, rgba(8, 22, 33, .92)); }
    .card__info b { display: block; font-size: .85rem; line-height: 1.25; }
    .card__info span { font-size: .7rem; color: #dfe6f1; letter-spacing: .06em; text-transform: uppercase; }
    .card__play { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
    .card__play::after { content: ""; border-left: 11px solid var(--on-accent); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
    @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } .card--wide { grid-column: span 2; } }

    .modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 14, 22, .95); display: none; align-items: center; justify-content: center; padding: 56px 16px 72px; }
    .modal.is-open { display: flex; }
    .modal__frame { width: min(92vw, 1100px); aspect-ratio: 16 / 9; max-height: 100%; }
    .modal__frame--v { width: auto; height: min(78vh, 900px); aspect-ratio: 9 / 16; max-width: 92vw; }
    .modal__frame video, .modal__frame iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #000; }
    .modal__close { position: absolute; top: 12px; right: 16px; font-size: 2.2rem; line-height: 1; }
    .modal__nav { position: absolute; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--muted); font-size: .85rem; }
    .modal__nav button { border: 1.5px solid var(--fg); border-radius: 999px; padding: .5em 1.3em; font-weight: 700; font-size: .8rem; color: var(--fg); }

    footer { border-top: 1px solid var(--line); padding: 28px var(--gutter); text-align: center; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header class="hero">
    <span class="hero__tag">Video Editor Portfolio</span>
    <h1>Raiane Alcântara<br><span>Video Editor</span></h1>
    <p>Reels, documentaries, explainers, motion graphics and AI video. Archive research, narration, sound design and clean animation. Tap any video to watch it here.</p>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" aria-label="Categories"><div class="tabs__in" id="tabs"></div></nav>
  <main class="grid" id="grid"></main>

  <footer>Raiane Alcântara · Video Editor · Premiere Pro · After Effects</footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal__close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
    <div class="modal__nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
  </div>

  <script src="assets/js/videos.js"></script>
  <script src="assets/js/work.js"></script>
</body>
</html>
